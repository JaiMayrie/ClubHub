<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="register.css" />
</head>
<body>
  <main class="page">
    <section class="card" aria-label="Registration form">
      <header class="card__header">
        <h1>Create your account</h1>
        <p>Join ClubHub and start exploring campus orgs.</p>
      </header>

      <div class="alert alert--error" id="serverError" hidden>
        Registration failed. Please try again.
      </div>

      <form class="form" id="registerForm" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            placeholder="Jaida Calvin"
            required
          />
          <p class="field__error" id="nameError" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@school.edu"
            required
          />
          <p class="field__error" id="emailError" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="At least 8 characters"
            minlength="8"
            required
          />
          <p class="field__error" id="passwordError" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Re-enter your password"
            required
          />
          <p class="field__error" id="confirmPasswordError" aria-live="polite"></p>
        </div>

        <button class="btn" type="submit" id="submitBtn">
          Create account
        </button>

        <p class="footer-text">
          Already have an account?
          <a href="login.html">Log in</a>
        </p>
      </form>
    </section>
  </main>

  <script>

    const form = document.getElementById("registerForm");
    const submitBtn = document.getElementById("submitBtn");

    const nameEl = document.getElementById("name");
    const emailEl = document.getElementById("email");
    const passEl = document.getElementById("password");
    const confirmEl = document.getElementById("confirmPassword");

    const errs = {
      name: document.getElementById("nameError"),
      email: document.getElementById("emailError"),
      password: document.getElementById("passwordError"),
      confirmPassword: document.getElementById("confirmPasswordError"),
    };

    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function setError(input, msg) {
      input.classList.toggle("input--error", Boolean(msg));
      const key = input.name;
      errs[key].textContent = msg || "";
    }

    function validate() {
      let ok = true;

      const name = nameEl.value.trim();
      const email = emailEl.value.trim();
      const pass = passEl.value;
      const confirm = confirmEl.value;

      if (!name) { setError(nameEl, "Name is required."); ok = false; }
      else setError(nameEl, "");

      if (!email) { setError(emailEl, "Email is required."); ok = false; }
      else if (!EMAIL_RE.test(email)) { setError(emailEl, "Enter a valid email address."); ok = false; }
      else setError(emailEl, "");

      if (!pass) { setError(passEl, "Password is required."); ok = false; }
      else if (pass.length < 8) { setError(passEl, "Password must be at least 8 characters."); ok = false; }
      else setError(passEl, "");

      if (!confirm) { setError(confirmEl, "Please confirm your password."); ok = false; }
      else if (confirm !== pass) { setError(confirmEl, "Passwords do not match."); ok = false; }
      else setError(confirmEl, "");

      submitBtn.disabled = !ok;
      return ok;
    }

    ["input", "blur"].forEach(evt => {
      form.addEventListener(evt, (e) => {
        if (e.target.matches("input")) validate();
      }, true);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!validate()) return;

      window.location.href = "login.html";
    });

    validate();
  </script>
</body>
</html>
